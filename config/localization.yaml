ekf_filter_node:
  ros__parameters:
    frequency: 60.0
    two_d_mode: true
    publish_acceleration: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    debug: false

    odom0: glim_ros/odometry/local   # glim_ros2@dev: optimized odometry, child frame base_link
    odom0_config: [true, true, false,   
                   false, false, true,   # roll, pitch, yaw
                   false,  false, false,   
                   false, false, false,    # vyaw
                   false, false, false]   # accelerations
    odom0_relative: false
    odom0_differential: false
    

    # IMU: yaw RATE only. The Xsens yaw (NorthReference, magnetometer) must not be fused: it is disturbed on
    # the robot (field 2026-11-23: up to 60 deg behind GLIM after spins, |mag| 0.84-1.61x) and published with
    # zero covariance, so the EKF trusted it over GLIM's yaw and the pose jumped 0.3-2.5 m per update
    # (418 m path for 34 m driven). Yaw comes from GLIM (odom0). Replay of the field bag: EKF within 2 mm of GLIM.
    imu0: imu/data
    imu0_config: [false, false, false,
                  false, false, false,   # no orientation
                  false, false, false,   # (an Imu message has no linear velocity)
                  false, false, true,    # vyaw
                  false, false, false]   # accelerations
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10



    odom1: visodom/odom
    odom1_config: [true, true, true,   # x, y, z — don't fuse absolute position
                   false, false, false,   # roll, pitch, yaw
                   true,  false, false,   # vx only (tracked vehicle, no lateral)
                   false, false, false,    # vyaw
                   false, false, false]   # accelerations
    odom1_relative: false
    odom1_differential: true
