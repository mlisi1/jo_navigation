
ekf_filter_node_odom:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_acceleration: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    debug: false

    odom0: glim_ros/odometry/local   # glim_ros2@dev: optimized odometry, child frame base_link
    odom0_config: [true, true, false,   
                   false, false, true,   # roll, pitch, yaw
                   false,  false, false,   
                   false, false, false,    # vyaw
                   false, false, false]   # accelerations
    odom0_relative: false
    odom0_differential: false


    odom1: visodom/odom
    odom1_config: [true, true, true,   
                   false, false, false,   # roll, pitch, yaw
                   true,  false, false,   
                   false, false, false,    # vyaw
                   false, false, false]   # accelerations
    odom1_relative: false
    odom1_differential: true
    

    # IMU: yaw RATE only. The Xsens yaw (NorthReference, magnetometer) must not be fused: it is disturbed on
    # the robot (field 2026-11-23: up to 60 deg behind GLIM after spins, |mag| 0.84-1.61x) and published with
    # zero covariance, so the EKF trusted it over GLIM's yaw and the pose jumped 0.3-2.5 m per update
    # (418 m path for 34 m driven). Yaw comes from GLIM (odom0). Replay of the field bag: EKF within 2 mm of GLIM.
    imu0: imu/data
    imu0_config: [false, false, false,
                  false, false, false,   # no orientation
                  false, false, false,   # (an Imu message has no linear velocity)
                  false, false, true,    # vyaw
                  false, false, false]   # accelerations
    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10



ekf_filter_node_map:
  ros__parameters:
    frequency: 15.0
    two_d_mode: true  # Recommended to use 2d mode for nav2 in mostly planar environments
    print_diagnostics: true
    debug: false
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    odom0: odometry/local
    odom0_config: [false, false, false,   # x, y, z 
                   false, false, true,   # roll, pitch, yaw
                   true, false, false,   # vx only (tracked vehicle, no lateral)
                   false, false, true,    # vyaw
                   false, false, false]   # accelerations
    odom0_relative: false
    odom0_differential: false
  

    odom1: odometry/gps
    odom1_config: [true,  true,  false,
                  false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    odom1_queue_size: 10
    odom1_differential: false
    odom1_relative: false





navsat_transform_node:
  ros__parameters:
    frequency: 4.0
    delay: 0.0
    zero_altitude: true
    magnetic_declination_radians: 0.0  # adjust for your location (Pisa ~0.04 rad)
    yaw_offset: 0.0                     # 1.57 compensated the Xsens mounted 90 deg off (x = robot right); fixed in the device on 2026-11-24 (RotSensor yaw, xsens_settings), so the IMU frame = base_link now
    broadcast_cartesian_transform: true      # publishes utm→map transform
    broadcast_cartesian_transform_as_parent_frame: true
    publish_filtered_gps: true         # republishes GPS in filtered form
    use_odometry_yaw: true            # use IMU for heading, not GPS
    wait_for_datum: true              # compute datum from first fix
    # datum: [43.6851163, 10.4869685, 0.0]
    # use_local_cartesian: true
    

    